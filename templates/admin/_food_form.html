<label>Name<input required name="name" value="{{ food.name if food else '' }}"></label><label>Description<textarea required name="description">{{ food.description if food else '' }}</textarea></label><label>Category<input required name="category" value="{{ food.category if food else '' }}"></label><label>Price (Rs.)<input required min="1" step="0.01" type="number" name="price" value="{{ food.price if food else '' }}"></label><label>Image / emoji<input name="image" placeholder="Example: 🍕" value="{{ food.image if food else '' }}"></label>
