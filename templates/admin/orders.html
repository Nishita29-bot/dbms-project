{% extends 'base.html' %}{% block content %}<section class="page-heading"><p class="eyebrow">ADMIN · ORDERS</p><h1>Customer orders</h1></section><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th></tr></thead><tbody>{% for order in orders %}<tr><td>#{{ order.id }}</td><td>{{ order.full_name }}</td><td>{{ order.phone }}</td><td>Rs. {{ '%.2f'|format(order.total_amount) }}</td><td><form class="status-form" method="post" action="{{ url_for('order_status', order_id=order.id) }}"><select name="status">{% for s in ['Pending','Preparing','Delivered'] %}<option {% if s == order.status %}selected{% endif %}>{{ s }}</option>{% endfor %}</select><button>Save</button></form></td></tr>{% else %}<tr><td colspan="5">No orders yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
