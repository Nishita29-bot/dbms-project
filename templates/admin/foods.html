{% extends 'base.html' %}{% block content %}<section class="admin-heading"><div><p class="eyebrow">ADMIN · FOODS</p><h1>Manage menu</h1></div><a class="button" href="{{ url_for('add_food') }}">+ Add food</a></section><div class="table-wrap"><table><thead><tr><th>Food</th><th>Category</th><th>Price</th><th>Actions</th></tr></thead><tbody>{% for food in foods %}<tr><td>{{ food.image }} {{ food.name }}</td><td>{{ food.category }}</td><td>Rs. {{ '%.2f'|format(food.price) }}</td><td class="actions"><a href="{{ url_for('edit_food', food_id=food.id) }}">Edit</a><form method="post" action="{{ url_for('delete_food', food_id=food.id) }}"><button class="link-button confirm-delete">Delete</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
