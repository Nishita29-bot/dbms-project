{% extends 'base.html' %}{% block content %}<section class="form-page"><form class="card-form checkout-form" method="post"><p class="eyebrow">ONE LAST STEP</p><h1>Checkout</h1><label>Delivery address<textarea required name="address" placeholder="House number, street, area"></textarea></label><label>Phone number<input required name="phone" placeholder="Your phone number"></label><div class="checkout-total">Total amount <b>Rs. {{ '%.2f'|format(total) }}</b></div><button class="button" type="submit">Place order</button><p class="hint">Payment method: Cash on delivery</p></form></section>{% endblock %}
