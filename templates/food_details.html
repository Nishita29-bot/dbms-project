{% extends 'base.html' %}{% block content %}<section class="detail"><div class="detail-image">{{ food.image or '🍽️' }}</div><div><p class="eyebrow">{{ food.category }}</p><h1>{{ food.name }}</h1><p>{{ food.description }}</p><h2>Rs. {{ '%.2f'|format(food.price) }}</h2>{% if session.role == 'customer' %}<form method="post" action="{{ url_for('add_cart', food_id=food.id) }}"><button class="button">Add to cart</button></form>{% else %}<a class="button" href="{{ url_for('login') }}">Login to order</a>{% endif %}</div></section>{% endblock %}
