<article class="food-card"><a class="food-image" href="{{ url_for('food_details', food_id=food.id) }}">{{ food.image or '🍽️' }}</a><div class="food-body"><small>{{ food.category }}</small><h3>{{ food.name }}</h3><p>{{ food.description[:68] }}{% if food.description|length > 68 %}...{% endif %}</p><div class="card-bottom"><strong>Rs. {{ '%.2f'|format(food.price) }}</strong>{% if session.role == 'customer' %}<form action="{{ url_for('add_cart', food_id=food.id) }}" method="post"><button class="icon-button" title="Add to cart">+</button></form>{% else %}<a class="text-link" href="{{ url_for('food_details', food_id=food.id) }}">Details</a>{% endif %}</div></div></article>
